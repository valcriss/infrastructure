# Agent seul, pour enrôler un hôte Docker supplémentaire.
#   CONSOLE_URL=wss://console.exemple.org/agent/ws \
#   ENROLLMENT_TOKEN=<jeton généré dans la console> \
#   docker compose -f docker-compose.agent.yml up -d
#
# Le jeton est à usage unique ; une fois enrôlé, l'agent conserve ses propres
# identifiants dans le volume agent-data. Hors réseau de confiance, utiliser wss://.

name: console-docker-agent

services:
  agent:
    image: ghcr.io/valcriss/infrastructure-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CONSOLE_URL: ${CONSOLE_URL:?définir CONSOLE_URL}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      WORKSPACE_DIR: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
      TRIVY_IMAGE: ${TRIVY_IMAGE:-ghcr.io/aquasecurity/trivy:0.76.1}
      TRIVY_MEMORY: ${TRIVY_MEMORY:-2g}
      TRIVY_MAX_IMAGE_GB: ${TRIVY_MAX_IMAGE_GB:-10}
      # Proxies transmis aux conteneurs Trivy (les deux casses sont conservees).
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      # Projets Compose que l'agent refuse d'arrêter ou redéployer (en plus du sien), séparés par des virgules.
      PROTECTED_PROJECTS: ${PROTECTED_PROJECTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/data
      # Même chemin absolu côté hôte et côté conteneur (bind mounts relatifs).
      - type: bind
        source: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
        target: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
        bind:
          create_host_path: true

volumes:
  agent-data:
