# Installation : console + agent local + PostgreSQL.
#   1. cp .env.example .env   puis définir POSTGRES_PASSWORD
#   2. docker compose up -d --build
#   3. docker compose logs console   (relever le secret d'initialisation)
#   4. ouvrir http://localhost:8080 et créer le compte administrateur

name: console-docker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infra
      POSTGRES_DB: infra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build:
      context: .
      target: console
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://infra:${POSTGRES_PASSWORD}@postgres:5432/infra
      # Passer à true dès que la console est servie en HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Autorité de certification d'un serveur Git interne (optionnel) : fichier monté dans le conteneur.
      GIT_CA_FILE: ${GIT_CA_FILE:-}
      # Supervision : période de collecte des métriques (s) et rétention (jours).
      METRICS_INTERVAL_SEC: ${METRICS_INTERVAL_SEC:-30}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    volumes:
      - shared:/shared
      # Clé maître (chiffre le jeton Git) et dépôt de travail de la sauvegarde.
      - console-data:/data
    networks: [internal]

  agent:
    build:
      context: .
      target: agent
    restart: unless-stopped
    depends_on:
      console:
        condition: service_healthy
    environment:
      CONSOLE_URL: ws://console:8080/agent/ws
      AGENT_HOSTNAME: hôte-local
      WORKSPACE_DIR: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
    volumes:
      # Le contrôle du démon Docker donne des capacités très élevées sur l'hôte,
      # même avec un montage présenté comme lecture seule.
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/data
      - shared:/shared:ro
      # Espace de travail des stacks, monté au MÊME chemin absolu côté hôte et
      # côté conteneur : le démon Docker de l'hôte résout les bind mounts
      # relatifs des Compose à partir de ce chemin.
      - type: bind
        source: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
        target: ${WORKSPACE_DIR:-/var/lib/console-docker/workspace}
        bind:
          create_host_path: true
    networks: [internal]

volumes:
  postgres-data:
  agent-data:
  shared:
  console-data:

networks:
  internal:
