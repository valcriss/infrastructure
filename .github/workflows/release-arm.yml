name: Release ARM

# Lancement manuel : ajoute l'architecture linux/arm64 à une version déjà publiée par le
# workflow « Release » (qui ne construit que l'amd64). Les images sont construites pour arm64
# sous émulation (plus lent), puis les tags de la version deviennent multi-architecture
# (amd64 + arm64). Ne fonctionne que pour les versions publiées avec le tag « <version>-amd64 ».

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version déjà publiée (ex. 0.0.9 ou 1.2.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [console, agent, patcher]
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Vérifier la version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version invalide : $VERSION" >&2
            exit 1
          fi

      # Le code construit est celui du tag de la version, pas celui de la branche courante.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Nom d'image en minuscules
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/infrastructure-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ inputs.version }}-arm64
          labels: |
            org.opencontainers.image.title=infrastructure-${{ matrix.target }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-arm64

      # Mêmes tags que le workflow « Release » : 1.1.1 → 1.1.1, 1.1, 1 et latest ;
      # une préversion ne reçoit que son propre tag.
      - name: Publier les tags multi-architecture
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          tags=("$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            major="${VERSION%%.*}"
            minor="${VERSION#*.}"; minor="${minor%%.*}"
            tags+=("$major.$minor" "$major" latest)
          fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
