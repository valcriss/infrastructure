name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base jetable : les tests d'intégration y recréent le schéma public.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test
      # Tests de l'agent avec le vrai Docker de l'exécuteur (bind mounts relatifs, etc.).
      DOCKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Dépendances de production uniquement : les outils de développement
      # (ESLint, etc.) ne sont pas livrés dans les images.
      - run: npm run audit:prod

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target console -t console-docker/console:ci .
      - run: docker build --target agent -t console-docker/agent:ci .
      - run: docker build --target patcher -t console-docker/patcher:ci .
      # Aucune vulnérabilité corrigeable (tous niveaux de gravité) dans les images générées : le contrôle échoue dès
      # qu'un correctif existe (paquet système, runtime Node ou dépendance). Les vulnérabilités sans correctif
      # connu ne bloquent pas. Même version de Trivy que celle utilisée par l'agent pour scanner les images.
      - name: Vulnérabilités corrigeables dans les images
        run: |
          trivy_image="$(grep -oE 'ghcr\.io/aquasecurity/trivy:[0-9.]+' packages/agent/src/config.ts | head -1)"
          echo "Trivy : $trivy_image"
          status=0
          for target in console agent; do
            echo "::group::Scan de console-docker/$target:ci"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image \
              --no-progress --ignore-unfixed --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --exit-code 1 "console-docker/$target:ci" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Le moteur de correctifs (Copa) est un binaire amont : sa bibliothèque standard Go n'est pas de notre fait. Le scan
      # est donc informatif (il ne bloque pas) ; le conteneur est éphémère, en lecture seule et sans capacités.
      - name: Vulnérabilités de l'image du moteur de correctifs (informatif)
        run: |
          trivy_image="$(grep -oE 'ghcr\.io/aquasecurity/trivy:[0-9.]+' packages/agent/src/config.ts | head -1)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image \
            --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 0 console-docker/patcher:ci


  # Parcours complet d'un correctif d'image sur le vrai Docker (copie dans un registre local, scan, Copa + BuildKit
  # rootless, rescan par digest, vérification de la configuration). Voir docs/adr/0002-remediation-images.md.
  patch-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PATCH_E2E: "1"
      PATCHER_IMAGE: console-docker/patcher:e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @infra/shared
      # Ubuntu 24.04 interdit par défaut les espaces de noms utilisateur non privilégiés (AppArmor) : BuildKit rootless
      # exige de les autoriser. Même réglage à faire sur un hôte réel (voir docs/exploitation.md).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: docker build --target patcher -t "$PATCHER_IMAGE" .
      - run: npx vitest run packages/agent/src/patcher.e2e.test.ts packages/agent/src/registry-gc.e2e.test.ts
