name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base jetable : les tests d'intégration y recréent le schéma public.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test
      # Tests de l'agent avec le vrai Docker de l'exécuteur (bind mounts relatifs, etc.).
      DOCKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Dépendances de production uniquement : les outils de développement
      # (ESLint, etc.) ne sont pas livrés dans les images.
      - run: npm run audit:prod

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target console -t console-docker/console:ci .
      - run: docker build --target agent -t console-docker/agent:ci .
